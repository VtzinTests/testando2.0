name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

# Cancela builds antigos se um novo for disparado na mesma branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    # ─── 1. Checkout enxuto ───
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # ─── 2. JDK 17 Temurin ───
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ─── 3. Cache do Android SDK (AAPT2 + platforms + build-tools) ───
    - name: Cache Android SDK components
      uses: actions/cache@v4
      with:
        path: |
          /usr/local/lib/android/sdk/platforms
          /usr/local/lib/android/sdk/build-tools
          /usr/local/lib/android/sdk/platform-tools
          ~/.android
        key: ${{ runner.os }}-android-sdk-v1
        restore-keys: |
          ${{ runner.os }}-android-sdk-

    # ─── 4. Setup Gradle com cache inteligente ───
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false
        gradle-home-cache-cleanup: true

    # ─── 5. Permissão do wrapper ───
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # ─── 6. Build com build-cache + configuration-cache ───
    - name: Build Debug APK (incremental)
      run: |
        ./gradlew assembleDebug \
          --build-cache \
          --configuration-cache \
          --parallel \
          --stacktrace

    # ─── 7. Upload do APK ───
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: testando2.0-Debug-APK
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error